name: "CI/CD"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  packages: write   # needed for GITHUB_TOKEN to push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      deploy_path: ${{ steps.vars.outputs.deploy_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image tag and deploy path
        id: vars
        run: |
          # On PRs, github.ref_name is "<number>/merge", so use the target branch instead
          BRANCH="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            echo "deploy_path=/opt/apps/finora/prod" >> "$GITHUB_OUTPUT"
            echo "build_env=production" >> "$GITHUB_OUTPUT"
            echo "api_base_url=https://api-finora.tushar.sbs" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=dev" >> "$GITHUB_OUTPUT"
            echo "deploy_path=/opt/apps/finora/dev" >> "$GITHUB_OUTPUT"
            echo "build_env=development" >> "$GITHUB_OUTPUT"
            echo "api_base_url=https://api-finora-dev.tushar.sbs" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name == 'push' }}   # PRs only verify the build
          tags: |
            ghcr.io/tusharlokhande/finora-api:${{ steps.vars.outputs.image_tag }}
            ghcr.io/tusharlokhande/finora-api:sha-${{ github.sha }}
          build-args: |
            ENVIRONMENT=${{ steps.vars.outputs.build_env }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push Client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/tusharlokhande/finora-client:${{ steps.vars.outputs.image_tag }}
            ghcr.io/tusharlokhande/finora-client:sha-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ steps.vars.outputs.api_base_url }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'   # never deploy from a PR
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false       # don't kill a deploy halfway through

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FINORA_SSH_PRIVATE_KEY }}" > ~/.ssh/finora
          chmod 600 ~/.ssh/finora
          # Better: store the host key in a variable/secret instead of scanning each run
          ssh-keyscan -p 2222 ssh.tushar.sbs >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_PATH: ${{ needs.build.outputs.deploy_path }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/finora -p 2222 deploy@ssh.tushar.sbs bash -s <<EOF
            set -e
            cd "$DEPLOY_PATH"
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF