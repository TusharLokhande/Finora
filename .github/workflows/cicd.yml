name: "CI/CD"

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev


env:
  IMAGE_TAG: ""
  DEPLOY_PATH: ""

jobs:
    build: 
        runs-on: ubuntu-latest
        
        environment:
            name: ${{ github.ref_name == 'main' && 'production' || 'development' }}

        steps:
          - name: Set environment variables
            run: |
                if [ "${{ github.ref_name }}" = "main" ]; then
                    echo "IMAGE_TAG=" 
                    echo "DEPLOY_PATH=/opt/apps/finora/prod" >> $GITHUB_ENV

                elif [ "${{ github.ref_name }}" = "dev" ]; then
                    echo "IMAGE_TAG=dev" >> $GITHUB_ENV
                    echo "DEPLOY_PATH=/opt/apps/finora/dev" >> $GITHUB_ENV
                fi
          
          - name: List files
            run: |
                ls -la
                echo "Current branch: ${{ github.ref_name }}"
                echo "Image tag: ${{ env.IMAGE_TAG }}"
                echo "Deploy path: ${{ env.DEPLOY_PATH }}"
                echo "Environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}"
                echo "Secrets: ${{ secrets.FINORA_SSH_PRIVATE_KEY }} ${{ secrets.GITHUB_TOKEN }}"

          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v2

          - name: Log in to GitHub Container Registry
            uses: docker/login-action@v2
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Build and push API image
            uses: docker/build-push-action@v5
            with:
              context: ./server
              file: ./server/Dockerfile
              push: true
              tags: ghcr.io/tusharlokhande/finora-api:${{ env.IMAGE_TAG }}
              build-args: |
                ENVIRONMENT=${{ github.ref_name }}

          - name: Build and push Client image
            uses: docker/build-push-action@v5
            with:
              context: ./client
              file: ./client/Dockerfile
              push: true
              tags: ghcr.io/tusharlokhande/finora-client:${{ env.IMAGE_TAG }}
        
    deploy: 
        runs-on: ubuntu-latest
        needs: build

        steps:
          - name: Setup SSH key
            run: |
              mkdir -p ~/.ssh
              echo "${{ secrets.FINORA_SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions_finora
              chmod 600 ~/.ssh/github_actions_finora

          - name: Deploy to server
            run: |
              ssh \
                -i ~/.ssh/github_actions_finora \
                -p 2222 \
                deploy@ssh.tushar.sbs 
          
          - name: Deploy Docker Compose
            working-directory: ${{ env.DEPLOY_PATH }}
            run: |
                docker-compose down 
                docker compose pull
                docker compose up -d --build